# Runs the offline test suite (test_*.py) on push to main and on PRs.
# The suites need no API key and make no paid calls — that's by design; they are
# the dry-run gates that guard everything which does spend (KICKOFF honesty
# contract: "pre-committed gates as code, dry-run before paid runs").
#
# Safe without a key because client.py reads OPENROUTER_API_KEY lazily, inside
# the call path — importing m0/m1/m1c never touches the network or the env.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0  # no floating v8 major tag exists
        with:
          enable-cache: true
      - name: Run the offline test suite
        # Deps resolve from pyproject.toml + uv.lock, which stay the single
        # source of truth — a dependency bump belongs in the manifest, not in
        # a parallel list here that would silently drift from it. --locked
        # fails the run instead of silently re-locking, so a uv.lock that has
        # drifted from pyproject.toml is caught here rather than never.
        run: uv run --locked --python 3.12 pytest -q
