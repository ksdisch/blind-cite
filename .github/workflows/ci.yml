# Runs the offline test suite (test_*.py) on push to main and on PRs.
# The suites need no API key and make no paid calls — that's by design; they are
# the dry-run gates that guard everything which does spend (KICKOFF honesty
# contract: "pre-committed gates as code, dry-run before paid runs").
#
# Safe without a key because client.py reads OPENROUTER_API_KEY lazily, inside
# the call path — importing m0/m1/m1c never touches the network or the env.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0  # no floating v8 major tag exists
        with:
          enable-cache: true
      - name: Run the offline test suite
        # This repo keeps flat scripts at the root with no pyproject (M0-BRIEF
        # D9), so the deps are named here rather than resolved from a manifest.
        # Majors are pinned so a future upstream break shows up as a dependency
        # bump rather than as a mystery red run on an unrelated PR.
        run: >
          uv run --python 3.12
          --with 'pytest>=8,<10'
          --with 'openai>=2,<3'
          --with 'python-dotenv>=1,<2'
          pytest -q
